[project]
name = "clean-dropbox"
version = "0.1.0"
description = "Clean Dropbox files/folders that match rules.dropboxignore (move or delete)."
readme = "README.md"
requires-python = ">=3.6"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
